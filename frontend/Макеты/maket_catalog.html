<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Макет: Каталог</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; padding: 10px; }
        .window { border: 2px solid #333; width: 100%; max-width: 800px; padding: 10px; }
        
        /* Верхняя панель */
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .logo { font-weight: bold; }
        .logout { border: 1px solid #333; padding: 5px 10px; background: #e0e0e0; }
        
        /* Меню */
        .menu { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .menu-item { border: 1px solid #333; padding: 5px 15px; background: #e0e0e0; font-size: 14px; }
        .menu-item.active { background: #ccc; font-weight: bold; }
        
        /* Поиск */
        .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { border: 1px solid #333; padding: 5px; flex-grow: 1; }
        
        /* Таблица */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        th { background: #e0e0e0; }
        .btn-action { border: 1px solid #333; background: #e0e0e0; padding: 2px 5px; font-size: 12px; cursor: pointer; }
        .low-stock { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="window">
        <div class="top-bar">
            <div class="logo">Система учета автозапчастей</div>
            <div class="logout">Выйти</div>
        </div>

        <div class="menu">
            <div class="menu-item active">Запчасти</div>
            <div class="menu-item">Поставщики</div>
            <div class="menu-item">Аналоги</div>
            <div class="menu-item">Продажи</div>
        </div>

        <div class="search-bar">
            <div class="search-input">[ Поиск по артикулу или названию ]</div>
            <div class="btn-action">Найти</div>
        </div>

        <table>
            <tr>
                <th>Артикул</th>
                <th>Наименование</th>
                <th>Цена</th>
                <th>Остаток</th>
                <th>Действия</th>
            </tr>
            <tr>
                <td>TOY-04152</td>
                <td>Фильтр масляный Toyota</td>
                <td>850 ₽</td>
                <td>50 шт.</td>
                <td><button class="btn-action">В корзину</button> <button class="btn-action">Аналоги</button></td>
            </tr>
            <tr>
                <td>BMW-3311</td>
                <td>Диск тормозной BMW</td>
                <td>8500 ₽</td>
                <td class="low-stock">4 шт. (Мало!)</td>
                <td><button class="btn-action">В корзину</button> <button class="btn-action">Аналоги</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
