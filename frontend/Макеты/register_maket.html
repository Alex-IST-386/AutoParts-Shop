<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Макет: Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; padding: 20px; }
        .window {
            border: 2px solid #333;
            width: 400px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .title { text-align: center; font-weight: bold; margin-bottom: 15px; }
        .input-box {
            border: 1px solid #333;
            padding: 5px;
            margin-bottom: 10px;
            color: #555;
        }
        .button {
            border: 1px solid #333;
            background: #e0e0e0;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .link-text {
            text-align: center;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title">Регистрация пользователя</div>
        
        <div class="input-box">[ Логин ]</div>
        <div class="input-box">[ Электронная почта ]</div>
        <div class="input-box">[ Пароль ]</div>
        <div class="input-box">[ Повторите пароль ]</div>
        
        <div class="button">Зарегистрироваться</div>
        
        <div class="link-text">Уже есть аккаунт? Войти</div>
    </div>
</body>
</html>
