<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Макет: Корзина</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; padding: 10px; }
        .window { border: 2px solid #333; width: 100%; max-width: 700px; padding: 10px; }
        
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .logo { font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 15px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        th { background: #e0e0e0; }
        
        .total-box { 
            border: 1px solid #333; 
            padding: 10px; 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold;
            margin-bottom: 15px;
            background: #f0f0f0;
        }
        
        .btn-checkout { 
            border: 1px solid #333; 
            background: #e0e0e0; 
            padding: 10px; 
            text-align: center; 
            font-weight: bold; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="top-bar">
            <div class="logo">Оформление продажи</div>
        </div>

        <table>
            <tr>
                <th>Товар</th>
                <th>Кол-во</th>
                <th>Цена</th>
                <th>Сумма</th>
                <th>Действие</th>
            </tr>
            <tr>
                <td>Фильтр масляный Toyota</td>
                <td>2</td>
                <td>850 ₽</td>
                <td>1700 ₽</td>
                <td><button class="btn-action">Удалить</button></td>
            </tr>
            <tr>
                <td>Свеча зажигания Toyota</td>
                <td>1</td>
                <td>1200 ₽</td>
                <td>1200 ₽</td>
                <td><button class="btn-action">Удалить</button></td>
            </tr>
        </table>

        <div class="total-box">
            <span>Итого к оплате:</span>
            <span>2900 ₽</span>
        </div>

        <div class="btn-checkout">Пробить чек</div>
    </div>
</body>
</html>
