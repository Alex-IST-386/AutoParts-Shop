<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Макет: Аналоги</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; padding: 10px; }
        .window { border: 2px solid #333; width: 100%; max-width: 800px; padding: 10px; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        th { background: #e0e0e0; }
        .btn { border: 1px solid #333; background: #e0e0e0; padding: 2px 5px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="window">
        <div class="top-bar">
            <div><b>Справочник аналогов (кросс-номеров)</b></div>
        </div>

        <div style="margin-bottom: 15px; padding: 10px; border: 1px solid #333; background: #f0f0f0;">
            <b>Поиск аналогов для артикула:</b>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <div style="border: 1px solid #333; padding: 5px; flex: 1;">[ Введите артикул ]</div>
                <div class="btn">Найти (BFS)</div>
            </div>
        </div>

        <table>
            <tr>
                <th>Оригинал</th>
                <th>Аналог</th>
                <th>Совместимость</th>
                <th>Действия</th>
            </tr>
            <tr>
                <td>TOY-04152 (Toyota)</td>
                <td>DEN-1500 (Denso)</td>
                <td>Toyota Camry</td>
                <td><button class="btn">Удалить связь</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
