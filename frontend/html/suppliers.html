<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поставщики | АвтоДеталь</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/suppliers.css">
</head>
<body>
    <header class="main-header">
        <a href="parts.html" class="logo">AutoParts Pro</a>
        <div class="user-profile">
            <a href="parts.html" class="btn-secondary" style="margin-right: 15px;">Назад в каталог</a>
            <button onclick="logout()" class="btn-secondary">Выйти</button>
        </div>
    </header>

    <main class="container">
        <!-- Режим поставщика -->
        <section id="supplier-section" hidden>
            <h1>Кабинет поставщика</h1>

            <h2>Мой профиль</h2>
            <div id="supplier-profile" class="card">Загрузка...</div>

            <h2>Статус моих поставок</h2>
            <div id="supplier-parts" class="card">Загрузка...</div>
        </section>

        <!-- Режим администратора -->
        <section id="admin-section" hidden>
            <h1>Управление поставщиками</h1>

            <h2>Добавить нового поставщика</h2>
            <form id="supplier-form" class="admin-form">
                <input id="supplier-name" placeholder="Название организации" required>
                <input id="supplier-contact" placeholder="Контакты (телефон или email)" required>
                <input id="supplier-user-id" type="number" min="1" placeholder="ID учётной записи (user_id)" required>
                <button type="submit" class="btn-primary">Добавить</button>
            </form>

            <h2>Список поставщиков</h2>
            <div id="suppliers-list" class="card">Загрузка...</div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/suppliers.js"></script>
</body>
</html>
