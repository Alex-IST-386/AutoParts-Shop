<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина | АвтоДеталь</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>
    <header class="main-header">
        <a href="parts.html" class="logo">AutoParts Pro</a>
        <div class="user-profile">
            <button onclick="logout()" class="btn-secondary" style="margin-right: 15px;">Выйти</button>
            <img src="../img/avatar_2d.png" alt="User" class="avatar">
        </div>
    </header>
    <main class="container">
        <h1>Оформление продажи</h1>
        <div class="cart-layout">
            <div class="cart-items" id="cart-items"><p>Корзина пуста.</p></div>
            <div class="cart-summary">
                <h2>Итого</h2>
                <div class="total-price">Сумма: <span id="total-price">0</span> ₽</div>
                <button id="checkout-btn" class="btn-primary">Пробить чек</button>
                <button onclick="window.location.href='parts.html'" class="btn-secondary" style="margin-top:10px; width:100%;">Назад в каталог</button>
            </div>
        </div>
    </main>
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
