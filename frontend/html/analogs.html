<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналоги | АвтоДеталь</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">AutoParts Pro</div>
        <nav class="user-profile">
            <a href="admin.html">Назад</a>
            <button class="btn-secondary" onclick="logout()">Выйти</button>
        </nav>
    </header>
    <div class="container">
        <h1 class="left-title">Справочник аналогов (Кросс-номера)</h1>
    </div>
    <section>
    <h2>Добавить связь</h2>
    <form id="analog-form">
        <div class="input-group">
            <label for="analog-part">Запчасть</label>
            <select id="analog-part" required></select>
        </div>
        <div class="input-group">
            <label for="analog-analog">Аналог (взаимозаменяемая запчасть)</label>
            <select id="analog-analog" required></select>
        </div>
        <button type="submit" class="btn-primary">Добавить связь</button>
    </form>
</section>

<section>
    <h2>Существующие связи</h2>
    <table>
        <thead>
            <tr><th>Запчасть</th><th>Аналог</th><th>Действия</th></tr>
        </thead>
        <tbody id="analogs-body"></tbody>
    </table>
</section>
    <script src="../js/api.js"></script>
    <script src = "../js/analogs.js"></script>
</body>
</html>
