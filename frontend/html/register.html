<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | АвтоДеталь</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel = "icon" href = "../img/register-icon.jpg">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Регистрация</h1>
            <form id="register">
                <div class="input-group">
                    <label for="username-register">Логин</label>
                    <input type="text" id="username-register" required minlength="3">
                </div>
                <div class="input-group">
                    <label for="password-register">Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="password-register" required minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('password-register', this)">Посмотреть</button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password-repeat">Повторите пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="password-repeat" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password-repeat', this)">Посмотреть</button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="email-register">Email (необязательно)</label>
                    <input type="email" id="email-register">
                </div>
                <button type="submit" id="btn-register-submit">Зарегистрироваться</button>
            </form>
            <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
