<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | АвтоДеталь</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Регистрация</h1>
            <form id="register">
                <div class="input-group">
                    <label for="username-register">Логин</label>
                    <input type="text" id="username-register" placeholder="Введите логин" required>
                </div>
                <div class="input-group password-wrapper">
                    <label for="password-register">Пароль</label>
                    <input type="password" id="password-register" placeholder="Придумайте пароль" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password-register', this)">Посмотреть</button>
                </div>
                <div class="input-group password-wrapper">
                    <label for="password-repeat">Повторите пароль</label>
                    <input type="password" id="password-repeat" placeholder="Повторите пароль" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password-repeat', this)">Посмотреть</button>
                </div>
                <div class="input-group">
                    <label for="email-register">Email (необязательно)</label>
                    <input type="email" id="email-register" placeholder="example@mail.ru">
                </div>
                <button type="submit" class="btn-primary" id="btn-register-submit">Зарегистрироваться</button>
            </form>
            <div class="auth-link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </div>
        </div>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
