<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | АвтоДеталь</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Вход в систему</h1>
            <form id="login">
                <div class="input-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Посмотреть</button>
                    </div>
                </div>
                <button type="submit" id="submit-login">Войти</button>
            </form>
            <p class="auth-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
