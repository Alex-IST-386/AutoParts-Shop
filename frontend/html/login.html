<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | АвтоДеталь</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Вход в систему</h1>
            <form id="login">
                <div class="input-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" placeholder="Введите логин" required>
                </div>
                <div class="input-group password-wrapper">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Введите пароль" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Посмотреть</button>
                </div>
                <button type="submit" class="btn-primary" id="submit-login">Войти</button>
            </form>
            <div class="auth-link">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>
        </div>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
