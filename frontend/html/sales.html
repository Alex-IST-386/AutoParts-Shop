<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>История продаж | АвтоДеталь</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* Стили для таблицы истории */
        .sales-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .sales-table th, .sales-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .sales-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #2c3e50;
        }
        .sales-table tr:hover {
            background-color: #f9f9f9;
        }
        .badge-status {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <a href="parts.html" class="logo">AutoParts Pro</a>
        <div class="user-profile">
            <a href="parts.html" class="btn-secondary" style="margin-right: 15px;">Назад в каталог</a>
            <button onclick="logout()" class="btn-secondary" style="margin-right: 15px;">Выйти</button>
            <img src="../img/avatar_2d.png" alt="User" class="avatar">
        </div>
    </header>

    <main class="container">
        <h1>История продаж (Чеки)</h1>

        <table class="sales-table" id="sales-table">
            <thead>
                <tr>
                    <th>Дата и время</th>
                    <th>Сумма</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="sales-body">
                <tr><td colspan="4" style="text-align:center;">Загрузка данных...</td></tr>
            </tbody>
        </table>
    </main>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('sales-body');

            // Делаем запрос к нашему API
            const res = await fetchWithAuth('/sales/');

            if (!res || !res.ok) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:red; text-align:center;">Ошибка загрузки. Возможно, нет прав.</td></tr>';
                return;
            }

            const sales = await res.json();

            if (sales.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Вы еще не пробивали чеки.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            sales.forEach(sale => {
                // Форматируем дату (из формата ISO в читаемый вид)
                const date = new Date(sale.created_at).toLocaleString('ru-RU');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${date}</td>
                    <td><b style="color: #4CAF50;">${sale.total_price} ₽</b></td>
                    <td><span class="badge-status">Оплачен</span></td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
